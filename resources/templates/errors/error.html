{% extends "base.html" %}
{% block title %}Erreur {{ code }}{% endblock %}

{% block content %}
<div class="card mx-auto mt-4" style="max-width: 600px;">
    <div class="card-body p-4 text-center">
        <span class="badge text-bg-secondary mb-2">Code {{ code }}</span>
        <h1 class="h4 fw-bold mb-3">{{ title }}</h1>
        <p class="text-muted mb-4">{{ message }}</p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Retour au tableau de bord</a>
    </div>
</div>
{% endblock %}

{% block guest_content %}
<div class="card mx-auto mt-4" style="max-width: 600px;">
    <div class="card-body p-4 text-center">
        <span class="badge text-bg-secondary mb-2">Code {{ code }}</span>
        <h1 class="h4 fw-bold mb-3">{{ title }}</h1>
        <p class="text-muted mb-4">{{ message }}</p>
        <a href="{{ url_for('auth.login') }}" class="btn btn-primary">Aller à la page de connexion</a>
    </div>
</div>
{% endblock %}
