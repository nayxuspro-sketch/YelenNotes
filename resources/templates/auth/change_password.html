{% extends "base.html" %}
{% block title %}Modifier mon mot de passe{% endblock %}

{% block content %}
<div class="card mx-auto" style="max-width: 520px;">
    <div class="card-header">Sécurité du compte — Modifier mon mot de passe</div>
    <div class="card-body">
        <form method="post" action="{{ url_for('auth.change_password') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label fw-semibold" for="current_password">Mot de passe actuel *</label>
                <input type="password" class="form-control" id="current_password" name="current_password" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold" for="new_password">Nouveau mot de passe (min. 8 caractères) *</label>
                <input type="password" class="form-control" id="new_password" name="new_password" required minlength="8">
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold" for="confirm_password">Confirmer le nouveau mot de passe *</label>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" required minlength="8">
            </div>
            <div class="d-flex justify-content-end gap-2">
                <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline-secondary">Annuler</a>
                <button type="submit" class="btn btn-primary">Mettre à jour</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
