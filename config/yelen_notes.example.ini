# ==============================================================================
# OVICLOUD NOTES — Fichier de configuration modèle
# Copiez ce fichier sous le nom "config/yelen_notes.ini" pour personnaliser
# le comportement du poste serveur sans modifier le programme.
# ==============================================================================

[server]
# Mode de fonctionnement :
#   monoposte  -> écoute uniquement sur 127.0.0.1 (ordinateur unique)
#   multiposte -> écoute sur 0.0.0.0 (accessible aux postes du réseau local)
mode = monoposte

# Port TCP du serveur HTTP Waitress
port = 5000

# Nombre de threads du serveur Waitress (4 à 8 recommandé pour une école primaire)
threads = 6

# Ouvrir automatiquement le navigateur au démarrage sous Windows (true / false)
open_browser = true

[storage]
# Répertoire indépendant des données scolaires (base SQLite, sauvegardes, logos, PDF, logs).
# Laisser vide pour utiliser l'emplacement standard recommandé :
#   Windows : C:\ProgramData\YelenNotes  (ou %LOCALAPPDATA%\YelenNotes sans droits admin)
# IMPORTANT : Ne jamais pointer vers un dossier partagé réseau (\\SERVEUR\...) ni OneDrive/Dropbox.
data_dir =

# Nom du fichier SQLite dans le sous-dossier database/
db_filename = ecole.db

[security]
# Clé secrète générée automatiquement dans <data_dir>/secret_key.txt si laissée vide
secret_key =

[updates]
# Dépôt GitHub utilisé pour la vérification des mises à jour officielles
# Format : organisation/nom-du-depot
github_repo = nayxuspro-sketch/YelenNotes
